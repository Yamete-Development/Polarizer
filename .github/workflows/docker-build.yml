name: Docker Build & Publish

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment (staging/prod)"
        required: false
        type: string
        default: ""
      version_tag:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

  build-and-push:
    needs: verify
    runs-on: arc-runner-set

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore Docker Rust cache
        id: rust-docker-cache
        uses: actions/cache@v6
        with:
          path: docker-cache
          key: polarizer-docker-rust-v2-rust-1.88.0-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            polarizer-docker-rust-v2-rust-1.88.0-${{ runner.arch }}-

      - name: Restore BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "docker-cache/cargo-registry": {
                "target": "/root/.cargo/registry",
                "id": "polarizer-cargo-registry"
              },
              "docker-cache/cargo-target": {
                "target": "/app/target",
                "id": "polarizer-target"
              }
            }
          skip-extraction: ${{ steps.rust-docker-cache.outputs.cache-hit }}

      - name: Determine tags and environment
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "float_tag=latest" >> "$GITHUB_OUTPUT"
            echo "version_tag=ghcr.io/maybesidequest/polarizer:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.version_tag }}" != "" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "float_tag=latest" >> "$GITHUB_OUTPUT"
            echo "version_tag=ghcr.io/maybesidequest/polarizer:${{ github.event.inputs.version_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "float_tag=staging" >> "$GITHUB_OUTPUT"
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi

          echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha,scope=polarizer
          cache-to: type=gha,mode=max,scope=polarizer
          tags: |
            ghcr.io/maybesidequest/polarizer:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/maybesidequest/polarizer:${{ steps.vars.outputs.float_tag }}
            ${{ steps.vars.outputs.version_tag }}
          secrets: |
            "hf_token=${{ secrets.HF_TOKEN }}"

      - name: Update GitOps repo
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          APP_DIR="polarizer"
          ENV="${{ steps.vars.outputs.environment }}"
          SHA="${{ steps.vars.outputs.sha_tag }}"

          git clone --depth 1 \
            "https://x-access-token:${GITOPS_PAT}@github.com/maybesidequest/interchat-kube-talos.git" \
            /tmp/gitops

          cd /tmp/gitops

          KUSTOMIZATION="kubernetes/apps/${APP_DIR}/overlays/${ENV}/kustomization.yaml"

          sed -i "s/newTag:.*/newTag: ${SHA}/" "$KUSTOMIZATION"

          git config user.name "ci-bot"
          git config user.email "ci-bot@interchat.fun"
          git add "$KUSTOMIZATION"
          git commit -m "deploy(${APP_DIR}-${ENV}): ${SHA}" || echo "No changes to commit"
          git push origin main
