name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (skip publish)"
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Capture source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Docker build for this commit
        if: inputs.dryRun == false
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          echo "Looking for docker-build.yml run for ${SOURCE_SHA}"

          RUN_ID=""

          for _ in {1..24}; do
            RUN_ID="$(
              gh run list \
                --workflow docker-build.yml \
                --commit "$SOURCE_SHA" \
                --event push \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"

            if [[ -n "$RUN_ID" ]]; then
              break
            fi

            echo "Docker workflow not visible yet; retrying in 5s..."
            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No docker-build.yml push run found for commit ${SOURCE_SHA}"
            exit 1
          fi

          echo "Found Docker workflow run ${RUN_ID}"
          gh run watch "$RUN_ID" --exit-status

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: ${{ inputs.dryRun }}
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            @semantic-release/git
            @semantic-release/exec

      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Promote existing image
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: v${{ steps.semantic.outputs.new_release_version }}
        shell: bash
        run: |
          IMAGE="ghcr.io/maybesidequest/polarizer"

          echo "Promoting ${IMAGE}:${SOURCE_SHA}"
          echo "  -> ${IMAGE}:${VERSION}"
          echo "  -> ${IMAGE}:latest"

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${SOURCE_SHA}"

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${SOURCE_SHA}"

          echo "Promotion complete."

      - name: Update production GitOps repo
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: v${{ steps.semantic.outputs.new_release_version }}
        shell: bash
        run: |
          APP_DIR="polarizer"
          ENV="prod"

          git clone --depth 1 \
            "https://x-access-token:${GITOPS_PAT}@github.com/maybesidequest/interchat-kube-talos.git" \
            /tmp/gitops

          cd /tmp/gitops

          KUSTOMIZATION="kubernetes/apps/${APP_DIR}/overlays/${ENV}/kustomization.yaml"

          sed -i "s/newTag:.*/newTag: ${SOURCE_SHA}/" "$KUSTOMIZATION"

          git config user.name "ci-bot"
          git config user.email "ci-bot@interchat.fun"

          git add "$KUSTOMIZATION"

          git commit \
            -m "deploy(${APP_DIR}-${ENV}): ${VERSION} (${SOURCE_SHA})" \
            || echo "No changes to commit"

          git push origin main
