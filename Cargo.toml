[package]
name = "polarizer"
version = "1.0.0"
edition = "2024"
description = "High-performance image analysis microservice with ONNX inference and perceptual hashing"
license = "Proprietary"

[dependencies]
# Async runtime
tokio = { version = "1.0.0"] }

# Redis client with async support
redis = { version = "1.0.0"] }

# HTTP client for image downloads
reqwest = { version = "1.0.0"] }

# Image processing & perceptual hashing
image = { version = "1.0.0"] }
image_hasher = "2"

# ONNX Runtime inference
ort = "2.0.0-rc.12"
ndarray = "0.17"

# Configuration
dotenvy = "0.15"

# Serialization
serde = { version = "1.0.0"] }
serde_json = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "1.0.0"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Hostname detection
hostname = "0.4"

# UUID generation for event bus IDs
uuid = { version = "1.0.0"] }

# Async trait support
async-trait = "0.1"

# Health check / metrics HTTP server
axum = "0.8"

# Graceful shutdown
tokio-util = { version = "1.0.0"] }
xxhash-rust = { version = "1.0.0"] }
rdkafka = "0.39.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
