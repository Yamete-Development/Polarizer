[package]
name = "polarizer"
version = "1.6.0"
edition = "2024"
rust-version = "1.88.0"
description = "Authoritative InterChat trust-and-safety service and dynamic policy engine"
license = "Proprietary"

[dependencies]
tokio = { version = "1", features = ["full"] }
redis = { version = "0.29", features = ["tokio-comp", "streams", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
image_hasher = "2"
ort = "2.0.0-rc.12"
ndarray = "0.17"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
hostname = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
async-trait = "0.1"
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rdkafka = { version = "0.39.0", features = ["zstd"] }

tikv-jemallocator = "0.6"

# New deps for Polarizer T&S migration
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json"] }
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", features = ["tls", "transport"] }
aho-corasick = "1.1"
mlua = { version = "0.10", features = ["luau", "vendored", "serialize"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
futures = "0.3"
dashmap = "6"
base64 = "0.22"
regex = "1.10"
unicode-normalization = "0.1"
rand = "0.8"
bytes = "1"
tokio-stream = "0.1"
hex = "0.4"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
